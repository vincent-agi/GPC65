<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page - Guet Patrimoine Caduceen</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': { DEFAULT: '#dc2626', light: '#ef4444', dark: '#b91c1c' },
                        'secondary': { DEFAULT: '#fbbf24', light: '#fcd34d', dark: '#f59e0b' },
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-amber-50 text-gray-800">
    <!-- Header -->
    <header class="sticky top-0 z-50 gradient-warm border-b border-amber-200 backdrop-blur-sm">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="../index.html" class="flex items-center gap-3">
                    <div class="w-10 h-10 gradient-hero rounded-lg flex items-center justify-center shadow-primary">
                        <span class="text-white font-bold text-lg">GPC</span>
                    </div>
                    <div class="hidden sm:block">
                        <h1 class="text-lg font-bold text-red-600 leading-tight">
                            Guet Patrimoine<br>
                            <span class="text-yellow-500 text-sm">Caduceen</span>
                        </h1>
                    </div>
                </a>

                <nav class="hidden lg:flex items-center gap-8">
                    <a href="../index.html#association" class="text-sm font-medium text-gray-800 hover:text-red-600 transition-smooth">Association</a>
                    <a href="../index.html#actualites" class="text-sm font-medium text-gray-800 hover:text-red-600 transition-smooth">Actualités</a>
                    <a href="../index.html#evenements" class="text-sm font-medium text-gray-800 hover:text-red-600 transition-smooth">Événements</a>
                    <a href="../index.html#contact" class="text-sm font-medium text-gray-800 hover:text-red-600 transition-smooth">Contact</a>
                </nav>

                <a href="../index.html" class="gradient-primary text-white px-4 py-2 rounded-lg text-sm font-medium shadow-primary">
                    ← Accueil
                </a>
            </div>
        </div>
    </header>

    <main class="py-12">
        <div class="container mx-auto px-4">
            <!-- Breadcrumb -->
            <nav class="breadcrumb mb-8">
                <a href="../index.html" class="text-red-600 hover:underline">Accueil</a>
                <span class="mx-2 text-gray-400">/</span>
                <span class="text-gray-500" id="breadcrumb-page">Page</span>
            </nav>

            <!-- Page Content -->
            <article class="max-w-4xl mx-auto">
                <!-- Page Header -->
                <header class="page-header rounded-xl mb-12">
                    <div class="px-4">
                        <h1 id="page-title" class="text-3xl md:text-4xl font-bold text-red-600">
                            Chargement...
                        </h1>
                    </div>
                </header>

                <!-- Page Body -->
                <div id="page-content" class="bg-white rounded-xl border border-amber-200 p-8 md:p-12 shadow-warm">
                    <!-- Contenu chargé dynamiquement -->
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text" style="width: 70%;"></div>
                </div>

                <!-- Back Link -->
                <div class="mt-12 text-center">
                    <a href="../index.html" class="inline-flex items-center gap-2 gradient-primary text-white px-6 py-3 rounded-lg shadow-primary hover:shadow-lg transition-smooth">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        Retour à l'accueil
                    </a>
                </div>
            </article>
        </div>
    </main>

    <!-- Footer -->
    <footer class="gradient-primary text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm text-white/80">© 2024 Guet Patrimoine Caduceen. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="../js/main.js"></script>
</body>
</html>
