<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog de l'association GPC65 - Articles sur le patrimoine culturel de la Bigorre.">
  <meta property="og:title" content="Blog - GPC65">
  <meta property="og:description" content="Découvrez nos articles sur le patrimoine culturel de la Bigorre.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://gpc65-website.web.app/blog">
  <meta property="og:image" content="http://gpc65-website.web.app/assets/images/og-image.jpg">
  <title>Blog - GPC65</title>
  <link rel="canonical" href="http://gpc65-website.web.app/blog">
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="/" class="logo">
        <img src="./assets/images/logo.png" alt="Logo GPC65" width="150">
      </a>
      <nav class="nav">
        <button class="nav-toggle" aria-label="Menu">
          <span class="hamburger"></span>
        </button>
        <ul class="nav-list">
          <li><a href="/">Accueil</a></li>
          <li><a href="/blog">Blog</a></li>
          <li><a href="/about">À propos</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="app">
    <div class="container">
      <h1>Blog</h1>
      <div class="blog-filters">
        <div class="filter-group">
          <label for="category-filter">Catégorie :</label>
          <select id="category-filter">
            <option value="">Toutes</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="tag-filter">Tag :</label>
          <select id="tag-filter">
            <option value="">Tous</option>
          </select>
        </div>
      </div>
      <div id="articles-container" class="grid"></div>
      <div id="pagination" class="pagination"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 GPC65. Tous droits réservés.</p>
    </div>
  </footer>

  <script src="./assets/js/utils.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/router.js"></script>
  <script src="./assets/js/components/ArticleCard.js"></script>
  <script src="./assets/js/main.js"></script>
</body>
</html>
